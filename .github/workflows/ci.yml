name: ci

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jwmv.slnx

      - name: Check formatting
        run: dotnet format Jwmv.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Jwmv.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Jwmv.slnx -c Release --no-build

      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $report = dotnet list Jwmv.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match 'has the following vulnerable packages') {
            throw 'Vulnerable NuGet packages detected.'
          }

  npm-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Test npm installer
        working-directory: npm
        run: npm test
